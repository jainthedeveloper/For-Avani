<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>for you</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root{
  --sky-top:#5B3A6E;
  --sky-mid:#B96A9E;
  --sky-low:#F2A0C0;
  --sky-glow:#FFD9E6;
  --snow:#FFF4F9;
  --ice:#7FD4EE;
  --ink:#3B1E38;
  --hot:#FF5C9E;
  --px:'Press Start 2P', monospace;
  --body:'VT323', monospace;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%}
body{
  font-family:var(--px);
  color:var(--ink);
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 38%,var(--sky-low) 68%,var(--sky-glow) 100%);
  overflow:hidden;
  image-rendering:pixelated;
  -webkit-font-smoothing:none;
}

/* ── pixel scene (JS se banta hai) ── */
#scene{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.pxl{position:absolute}
.cloud{animation:drift linear infinite}
@keyframes drift{to{transform:translateX(115vw)}}
.flake{background:#fff;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(105vh)}}
.spark{animation:tw 2.4s steps(2) infinite}
@keyframes tw{50%{opacity:0}}

/* ── screens ── */
#app{position:relative;z-index:3;height:100%}
.screen{
  position:absolute;inset:0;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:26px 20px 130px;text-align:center;gap:22px;
}
.screen.on{display:flex;animation:fadein .45s steps(3)}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ── pixel frame (reference wala nested border) ── */
.frame{
  background:var(--snow);padding:12px;
  box-shadow:0 0 0 4px var(--hot),0 0 0 8px var(--snow),0 0 0 12px var(--ink);
}
.frame img,.sprite{display:block;image-rendering:pixelated}

/* ── text ── */
h1{font-size:clamp(1rem,5.4vw,2.1rem);line-height:1.7;letter-spacing:.1em;color:var(--hot);
   text-shadow:3px 3px 0 var(--snow),6px 6px 0 rgba(59,30,56,.25)}
h2{font-size:clamp(.72rem,3.5vw,1.15rem);line-height:2;letter-spacing:.08em;color:var(--ink)}
.small{font-size:clamp(.55rem,2.6vw,.72rem);letter-spacing:.14em;color:#6B3B60;line-height:2.2}

/* ── dialogue box ── */
.box{
  width:min(560px,92vw);background:var(--snow);
  padding:22px 20px;text-align:left;
  box-shadow:0 0 0 4px var(--ink),0 0 0 8px var(--snow),0 0 0 12px var(--hot);
  min-height:180px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;
}
.box__label{font-size:.55rem;letter-spacing:.2em;color:var(--hot)}
.box__text{font-family:var(--body);font-size:clamp(1.15rem,4.4vw,1.5rem);line-height:1.35;color:var(--ink)}
.box__text b{color:var(--hot);font-weight:400}

/* ── buttons ── */
.btn{
  font-family:var(--px);font-size:clamp(.55rem,2.8vw,.75rem);letter-spacing:.14em;
  padding:14px 22px;border:none;cursor:pointer;
  background:var(--snow);color:var(--ink);
  box-shadow:0 0 0 4px var(--ink),0 4px 0 4px var(--ink);
  transition:transform .08s steps(1);
}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 4px var(--ink)}
/* YES bada, No chhota — size font/padding se, transform se nahi,
   kyunki JS no-click pe yes ko scale karta hai aur transform overwrite ho jaata */
.btn--yes{background:var(--hot);color:var(--snow);
  font-size:clamp(.9rem,4.6vw,1.35rem);padding:22px 50px;letter-spacing:.18em;
  box-shadow:0 0 0 5px var(--ink),0 6px 0 5px var(--ink),inset 0 5px 0 rgba(255,255,255,.4)}
.btn--yes:active{transform:translateY(6px);box-shadow:0 0 0 5px var(--ink),inset 0 5px 0 rgba(255,255,255,.4)}
.btn--no{background:var(--snow);color:#8A5A80;
  font-size:clamp(.45rem,2.1vw,.6rem);padding:10px 16px;opacity:.85}
.btn--wide{max-width:92vw;line-height:2;white-space:normal}
.row{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:80px}

/* husky naam ke upar baithi hai — negative margin se letters ko chhu rahi hai */
.perch{display:flex;flex-direction:column;align-items:center}
.perch .sprite{max-width:46vw;height:auto;margin-bottom:-10px;position:relative;z-index:2;
  animation:idle 2.6s steps(1) infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.blink{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}

/* ── timer ── */
.timer{font-size:clamp(.85rem,4.2vw,1.5rem);color:var(--hot);letter-spacing:.06em;
  text-shadow:3px 3px 0 var(--snow)}

/* ── photo nav ── */
/* media apne asli shape me rehta hai — crop nahi hota, frame adjust ho jaata hai */
.media{display:block;max-width:min(330px,78vw);max-height:42vh;width:auto;height:auto}
#mediaFrame{min-height:190px;display:flex;align-items:center;justify-content:center}
.dots{display:flex;gap:8px}
.dot{width:9px;height:9px;background:rgba(59,30,56,.3)}
.dot.on{background:var(--hot)}

/* ── chalta hua husky ── */
.walker{bottom:70px;left:-140px;animation:walk 40s linear infinite}
@keyframes walk{to{transform:translateX(calc(100vw + 280px))}}
.walker2{left:auto;right:-140px;animation:walk2 56s linear infinite}
@keyframes walk2{to{transform:translateX(calc(-100vw - 280px))}}
.paw{animation:fadepaw 6s linear forwards}
@keyframes fadepaw{0%{opacity:.55}70%{opacity:.35}100%{opacity:0}}

/* ── burst ── */
.burst{position:fixed;z-index:60;pointer-events:none;animation:fall linear forwards}
</style>
</head>
<body>

<div id="scene"></div>

<div id="app">

  <!-- 0 -->
  <section class="screen on" data-s="0">
    <div class="perch">
      <svg class="sprite" id="sprite0" width="208" height="192" viewBox="0 0 26 24" shape-rendering="crispEdges"></svg>
      <h1 id="t0">Oyee Avani</h1>
    </div>
    <p class="small" id="sub0"></p>
    <button class="btn blink btn--wide" data-go="1">Happy Birthday My Scammer →</button>
  </section>

  <!-- 1 -->
  <section class="screen" data-s="1">
    <p class="small">we've been a thing for</p>
    <div class="timer" id="timer">—</div>
    <p class="small" id="since"></p>
    <button class="btn blink" data-go="2">press to continue →</button>
  </section>

  <!-- 2 -->
  <section class="screen" data-s="2">
    <div class="box">
      <p class="box__label" id="noteLabel">NOTE 01</p>
      <p class="box__text" id="noteText"></p>
    </div>
    <button class="btn" id="noteNext">next →</button>
  </section>

  <!-- 3 -->
  <section class="screen" data-s="3">
    <p class="small">the photo album</p>
    <div class="frame" id="mediaFrame">
      <img class="media" id="photo" alt="">
    </div>
    <p class="box__text" id="photoCap" style="font-size:1.4rem"></p>
    <div class="dots" id="dots"></div>
    <div class="row">
      <button class="btn" id="prevP">←</button>
      <button class="btn" id="nextP">→</button>
      <button class="btn" data-go="4">skip →</button>
    </div>
  </section>

  <!-- 4 -->
  <section class="screen" data-s="4">
    <div class="box">
      <p class="box__label">BIRTHDAY WISH</p>
      <p class="box__text" id="letterText"></p>
    </div>
    <button class="btn" id="letterNext">next →</button>
  </section>

  <!-- 5 -->
  <section class="screen" data-s="5">
    <div class="frame"><svg class="sprite" id="sprite5" width="198" height="176" viewBox="0 0 18 16" shape-rendering="crispEdges"></svg></div>
    <h1 id="q"></h1>
    <div class="row">
      <button class="btn btn--yes" id="yes">YES</button>
      <button class="btn btn--no" id="no">No</button>
    </div>
  </section>

  <!-- 6 -->
  <section class="screen" data-s="6">
    <div class="frame"><svg class="sprite" id="sprite6" width="216" height="192" viewBox="0 0 18 16" shape-rendering="crispEdges"></svg></div>
    <h1>YAY!</h1>
    <h2 id="yayText"></h2>
    <p class="small" id="memory"></p>
  </section>

</div>

function drawSprite(svg,grid,coat){
  const PAL=coat?Object.assign({},C,coat):C;
  svg.innerHTML="";
  grid.forEach((row,y)=>{
    [...row].forEach((ch,x)=>{
      if(!PAL[ch]) return;
      const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
      r.setAttribute("x",x); r.setAttribute("y",y);
      r.setAttribute("width",1); r.setAttribute("height",1);
      r.setAttribute("fill",PAL[ch]);
      svg.appendChild(r);
    });
  });
}

/* koi bhi sprite, kisi bhi size me — ek pixel = `size` real pixels */
function makeSprite(grid,size,coat){
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${grid[0].length} ${grid.length}`);
  svg.setAttribute("width",grid[0].length*size);
  svg.setAttribute("height",grid.length*size);
  svg.setAttribute("shape-rendering","crispEdges");
  svg.style.display="block";
  drawSprite(svg,grid,coat);
  return svg;
}


/* ── 2. PIXEL SCENE ── mountains, trees, clouds, snow ── */
const scene=document.getElementById("scene");
function px(x,y,w,h,color,cls){
  const d=document.createElement("div");
  d.className="pxl"+(cls?" "+cls:"");
  d.style.cssText=`left:${x}px;bottom:${y}px;width:${w}px;height:${h}px;background:${color}`;
  return scene.appendChild(d),d;
}

let timers=[];
function buildScene(){
  timers.forEach(clearInterval); timers=[];   // resize pe purane timer band karo
  scene.innerHTML="";
  const W=innerWidth,P=6;

  // pahaad — har row upar jaake chhoti hoti hai
  [[.12,13],[.34,17],[.62,11],[.85,15]].forEach(([pos,rows])=>{
    const cx=W*pos;
    for(let i=0;i<rows;i++){
      const w=(rows-i)*2*P;
      px(cx-w/2, 90+i*P, w, P, i>rows-4 ? "#FFF4F9" : "#7A5A85");
    }
  });

  // pine trees
  for(let t=0;t<Math.ceil(W/90);t++){
    const cx=Math.random()*W, h=3+Math.floor(Math.random()*3);
    px(cx-P/2, 60, P, P*2, "#4A3550");
    for(let i=0;i<h;i++){
      const w=(h-i+1)*2*P;
      px(cx-w/2, 60+P*2+i*P*2, w, P*2, "#2E6B5C");
    }
  }

  // zameen
  px(0,0,W,72,"#FFF4F9");
  px(0,72,W,P,"#FFFFFF");

  // khade hue huskies — alag coat, alag size, kuch ulti taraf
  [[.05,3],[.14,2],[.23,4],[.34,2],[.45,3],[.57,4],[.68,2],[.78,3],[.88,2],[.96,3]]
    .forEach(([pos,sz],i)=>{
      const d=document.createElement("div");
      d.className="pxl";
      d.style.cssText=`left:${W*pos-sz*13}px;bottom:70px`;
      if(i%3===0) d.style.transform="scaleX(-1)";
      d.appendChild(makeSprite(SIDE_A,sz,COATS[i%COATS.length]));
      scene.appendChild(d);
    });

  // do chalte hue huskies — ek idhar se, ek udhar se
  [["walker",COATS[2],4,false],["walker walker2",COATS[1],3,true]].forEach(([cls,coat,sz,flip])=>{
    const lane=document.createElement("div");
    lane.className="pxl "+cls;
    const inner=document.createElement("div");
    if(flip) inner.style.transform="scaleX(-1)";     // flip andar, warna walk animation tut jaati
    inner.appendChild(makeSprite(SIDE_A,sz,coat));
    lane.appendChild(inner);
    scene.appendChild(lane);

    let f=0;
    timers.push(setInterval(()=>{
      f^=1;
      drawSprite(inner.firstChild, f?SIDE_B:SIDE_A, coat);
    },240));

    timers.push(setInterval(()=>{
      const r=lane.getBoundingClientRect();
      if(r.left<0||r.left>W) return;
      const paw=document.createElement("div");
      paw.className="pxl paw";
      paw.style.cssText=`left:${r.left+sz*4}px;bottom:64px;width:4px;height:4px;background:#C9A8CE`;
      scene.appendChild(paw);
      setTimeout(()=>paw.remove(),6000);
    },600));
  });

  // baadal
  for(let i=0;i<5;i++){
    const c=document.createElement("div");
    c.className="pxl cloud";
    const y=innerHeight*(.08+Math.random()*.34);
    c.style.cssText=`left:-160px;top:${y}px;width:120px;height:36px;
      animation-duration:${50+Math.random()*60}s;animation-delay:-${Math.random()*70}s;
      background:
        linear-gradient(#FFF,#FFF) 24px 0/72px 12px no-repeat,
        linear-gradient(#FFF,#FFF) 0 12px/120px 12px no-repeat,
        linear-gradient(#FFF,#FFF) 12px 24px/96px 12px no-repeat;
      opacity:.75`;
    scene.appendChild(c);
  }

  // barf — steps() se pixel-jump motion aata hai, smooth nahi
  for(let i=0;i<70;i++){
    const f=document.createElement("div");
    f.className="pxl flake";
    const s=Math.random()<.3?6:3;
    f.style.cssText=`left:${Math.random()*W}px;top:-20px;width:${s}px;height:${s}px;
      animation-duration:${5+Math.random()*9}s;animation-delay:-${Math.random()*14}s;
      animation-timing-function:steps(${20+Math.floor(Math.random()*20)});opacity:${.5+Math.random()*.5}`;
    scene.appendChild(f);
  }

  // chamak
  for(let i=0;i<14;i++){
    const s=document.createElement("div");
    s.className="pxl spark";
    s.style.cssText=`left:${Math.random()*W}px;top:${Math.random()*innerHeight*.6}px;
      width:4px;height:12px;animation-delay:-${Math.random()*3}s;
      background:linear-gradient(#FFF,#FFF) 0 4px/4px 4px no-repeat,
                 linear-gradient(#FFF,#FFF) -4px 4px/12px 4px no-repeat;overflow:visible`;
    scene.appendChild(s);
  }
}

  cur=n;
  screens[cur].classList.add("on");
  if(n===2) showNote(0);
  if(n===4) showLetter(0);
}

/* ── 4. TYPEWRITER ── skip() bhi return karta hai ──
   Tag mile toh pura ek saath daalta hai, warna screen pe "<b" dikh jaata. */
function type(el,html,speed=24){
  el.innerHTML=""; let i=0;
  const t=setInterval(()=>{
    if(html[i]==="<"){
      const e=html.indexOf(">",i);
      i = e===-1 ? html.length : e+1;
    } else i++;
    el.innerHTML=html.slice(0,i);
    if(i>=html.length) clearInterval(t);
  },speed);
  return ()=>{clearInterval(t);el.innerHTML=html;};
}

noteNext.addEventListener("click",()=>{
  if(skipNote){skipNote();skipNote=null;return;}   // pehla click = skip
  nIdx+1<CONFIG.notes.length?showNote(nIdx+1):go(3);
});

let lIdx=0,skipLetter=null;
function showLetter(i){
  lIdx=i;
  skipLetter=type(letterText,CONFIG.letter[i]);
}
letterNext.addEventListener("click",()=>{
  if(skipLetter){skipLetter();skipLetter=null;return;}
  lIdx+1<CONFIG.letter.length?showLetter(lIdx+1):go(5);
});


/* ── 6. PHOTOS ── */
let pIdx=0;
CONFIG.photos.forEach(()=>{const d=document.createElement("i");d.className="dot";dots.appendChild(d)});
function showPhoto(i){
  pIdx=(i+CONFIG.photos.length)%CONFIG.photos.length;
  const p=CONFIG.photos[pIdx];
  p.src?photo.src=p.src:photo.removeAttribute("src");
  photoCap.textContent=p.caption;
  [...dots.children].forEach((d,j)=>d.classList.toggle("on",j===pIdx));
}
prevP.addEventListener("click",()=>showPhoto(pIdx-1));
nextP.addEventListener("click",()=>showPhoto(pIdx+1));
showPhoto(0);


/* ── 7. LIVE TIMER ── */
const start=new Date(CONFIG.startDate);
since.textContent="since "+start.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
setInterval(()=>{
  const ms=Date.now()-start;
  timer.textContent=`${Math.floor(ms/864e5)}d ${Math.floor(ms/36e5)%24}h ${Math.floor(ms/6e4)%60}m ${Math.floor(ms/1e3)%60}s`;
},1000);


/* ── 8. YES / NO ── */
let step=0;
no.addEventListener("mouseover",()=>{
  no.style.position="fixed";
  no.style.left=Math.random()*(innerWidth-140)+"px";
  no.style.top=Math.random()*(innerHeight-160)+80+"px";
});
no.addEventListener("click",()=>{           // mobile ke liye — hover nahi hota
  step++;
  if(step>=CONFIG.noOptions.length){no.style.display="none";return;}
  no.textContent=CONFIG.noOptions[step];
  yes.style.transform=`scale(${1+step*.11})`;
});
yes.addEventListener("click",()=>{
  if(!localStorage.getItem("saidYes"))localStorage.setItem("saidYes",Date.now());
  go(6); burst();
  const d=Math.floor((Date.now()-+localStorage.getItem("saidYes"))/864e5);
  memory.textContent=d<1?"you said yes today":`you said yes ${d} day${d>1?"s":""} ago`;
});

function burst(){
  const cols=["#FFFFFF","#FF5C9E","#7FD4EE","#FFD9E6"];
  for(let i=0;i<80;i++){
    const f=document.createElement("div");
    f.className="burst";
    const s=Math.random()<.4?9:5;
    f.style.cssText=`left:${Math.random()*innerWidth}px;top:-20px;width:${s}px;height:${s}px;
      background:${cols[i%4]};animation-duration:${2+Math.random()*2.5}s;
      animation-delay:${Math.random()*.8}s;animation-timing-function:steps(18)`;
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),5200);
  }
}
</script>
